<!doctype html>
<html lang="en" class="bg-base">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEEFEE" />
    <meta name="description" content="AURUM AI — institutional market intelligence and AI-assisted trading command centre." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AURUM AI — Market Intelligence</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        var t = JSON.parse(localStorage.getItem('aurum.settings') || '{}').state;
        if (t && t.theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0E0D');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
