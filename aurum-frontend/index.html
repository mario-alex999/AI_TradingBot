<!doctype html>
<html lang="en" class="bg-base">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEEFEE" />
    <meta name="description" content="AURUM AI — institutional market intelligence and AI-assisted trading command centre." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AURUM AI — Market Intelligence</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode). Mirrors src/theme/theme.ts.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('aurum.settings') || '{}').state || {};
          var pref = s.theme || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
