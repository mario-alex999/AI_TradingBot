# AURUM AI - instrument and broker-symbol mapping.
#
# "symbol" keys are AURUM's canonical names (used in the database and CLI).
# "broker_symbol" is the exact name in YOUR broker's MT5 Market Watch.
# Brokers often add suffixes/prefixes, e.g. EURUSD.m, EURUSDm, XAUUSD+, GOLD, US30.cash, DJ30, WS30.
# Change broker_symbol here - no Python code changes required.
#
# trading_hours (all times in UTC) are used to tell market closures apart from unexpected data gaps:
#   weekly_close / weekly_open : "<DAY> HH:MM"  (DAY = MON..SUN)
#   daily_breaks               : list of ["HH:MM", "HH:MM"] windows when the market is closed every day
#   holidays                   : list of YYYY-MM-DD dates treated as closed all day
# Defaults are typical for a GMT+2/+3 broker; adjust to your broker's contract specification.

defaults:
  trading_hours:
    weekly_close: "FRI 21:00"
    weekly_open: "SUN 21:00"
    daily_breaks: []
    holidays: ["2026-12-25", "2027-01-01"]

instruments:
  EURUSD:
    broker_symbol: EURUSD
    asset_class: forex
    description: Euro vs US Dollar

  GBPUSD:
    broker_symbol: GBPUSD
    asset_class: forex
    description: British Pound vs US Dollar

  XAUUSD:
    broker_symbol: XAUUSD
    asset_class: metal
    description: Gold spot vs US Dollar
    trading_hours:
      weekly_close: "FRI 21:00"
      weekly_open: "SUN 22:00"
      daily_breaks: [["21:00", "22:00"]]

  US30:
    broker_symbol: US30
    asset_class: index
    description: Dow Jones Industrial Average CFD
    trading_hours:
      weekly_close: "FRI 21:00"
      weekly_open: "SUN 22:00"
      daily_breaks: [["21:00", "22:00"]]
