# Module 08 - Workflow Orchestration: initial (version 1) configuration.
# After the first start this file only seeds the database. Later changes go through PUT /api/v1/orchestration/config
# (a new audited version with a reason) or the Configuration tab of the Orchestration page.
# No secrets here: N8N_API_KEY, N8N_WEBHOOK_SHARED_SECRET, N8N_WEBHOOK_AUTH_TOKEN and ORCHESTRATION_SERVICE_TOKEN live in .env.

retry:                      # default policy; a workflow registration can override any field
  max_attempts: 5
  base_seconds: 15
  factor: 2.0
  max_backoff_seconds: 900
  max_elapsed_seconds: 21600
  jitter: 0.1
  retry_on_workflow_failure: false
  retry_on_timeout: false

dispatch:
  max_parallel: 5           # starting point for the demo (regular n8n execution mode); raise only after load testing
  batch_size: 50
  lease_seconds: 120

timeouts:
  default_execution_seconds: 300
  n8n_request_seconds: 10
  module_request_seconds: 10

callbacks:
  max_skew_seconds: 300
  signature_required: false # true = callbacks must carry X-Aurum-Signature as well as the service token
  max_output_bytes: 65536

events:
  delivery_max_attempts: 6
  retention_days: 30
  bridge_sources: [module_06, module_07]
  allowed_webhook_hosts: [localhost, 127.0.0.1, host.docker.internal, n8n, aurum-n8n]

scheduling:
  timezone: Africa/Lagos    # schedules are read in this zone; every stored timestamp is UTC
  catch_up: latest

health:
  interval_seconds: 60
  history_days: 7
  degraded_failure_rate: 0.5
  min_executions_for_rate: 4
  event_lag_warn_seconds: 300

alerts:
  dead_letter_warn: 1
  failure_rate_warn: 0.25

modules: {}                 # e.g. module_09: {base_url: "http://module09:8100"} once Module 09 exists

market_monitoring:          # WF08-01 Market Monitoring Scheduler (candle-close based)
  enabled: true             # backend off switch: false = WF08-01 stops before checking or requesting anything
  symbols: [EURUSD, GBPUSD, XAUUSD, US30]
  timeframes: [D1, H4, H1, M15, M5]
  settle_seconds: 60        # wait this long after a candle closes so Module 01 has stored it
  stale_factor: 3.0         # latest closed candle older than 3 x its period -> reported stale (collection behind)
  request_event: ai.analysis.requested   # or technical.analysis.requested
  require_module_01_data: true

market_analysis:            # WF08-02 Market Analysis Orchestrator (answers ai.analysis.requested with a Module 05 run)
  enabled: true             # backend off switch: false = WF08-02 stops before analysing anything
  ai_review: true           # Module 05 may use its AI reviewer when one is configured (it is optional)
  coalesce: true            # one WF08-02 run per WF08-01 run instead of one per request event
  lookback_hours: 72        # unanswered requests older than this are ignored
  max_symbols_per_run: 8
  required_timeframes: [H1] # closed candles that must exist before a symbol is analysed
  max_data_age_hours: 120   # newest required candle older than this -> reported stale
  block_when_stale: false   # true = skip symbols whose data is stale

trade_opportunities:        # WF08-03 Trade Opportunity Processor (hands new Module 05 ideas to Module 06)
  enabled: true             # backend off switch: false = WF08-03 stops before assessing anything
  coalesce: true            # one WF08-03 run per WF08-02 run instead of one per analysis event
  max_ideas_per_run: 20

approval_notifications:     # WF08-04 Human Approval Notification (opens the Module 07 request and notifies reviewers)
  enabled: true             # backend off switch: false = WF08-04 stops before notifying anyone
  coalesce: true            # one WF08-04 run per WF08-03 run instead of one per risk event
  max_ideas_per_run: 20

approval_responses:         # WF08-05 Approval Response Handler (verifies and records each Module 07 outcome)
  enabled: true             # backend off switch: false = WF08-05 stops before recording anything
  max_responses_per_run: 20
  lookback_hours: 72        # a sweep without an event only looks this far back
  expire_overdue_requests: false   # true only where no Module 07 worker runs: lets Module 07 expire overdue requests on each tick

trade_handoff:              # WF08-06 Approved Trade Handoff (verifies and records Module 07's execution requests; sends no order)
  enabled: true             # backend off switch: false = WF08-06 stops before recording anything
  max_handoffs_per_run: 20
  lookback_hours: 72

trade_monitoring:           # WF08-07 Trade Monitoring Orchestrator (records position changes, notifies; takes no trade action)
  enabled: true             # backend off switch: false = WF08-07 stops before recording anything
  max_trades_per_run: 50
  stale_after_seconds: 300  # a position record older than this is reported as stale
  closed_lookback_hours: 72
  notify_dashboard: true    # false = record only

error_recovery:             # WF08-08 Error Handling and Recovery (records failed runs, escalates what is not retried)
  enabled: true             # backend off switch: false = WF08-08 stops before recording anything
  max_errors_per_run: 20
  lookback_hours: 72
  notify_dashboard: true    # false = record only

health_watchdog:            # WF08-09 System Health Watchdog (checks every service, records, alerts on new problems)
  enabled: true             # backend off switch: false = WF08-09 checks and records nothing
  market_data_stale_minutes: 30   # while the market is open, a newest candle older than this is reported as stale
  account_stale_minutes: 60
  database_slow_ms: 2000
  notify_dashboard: true    # false = record only

information_updates:        # WF08-10 News and COT Update Scheduler (refreshes Module 02/04 sources when each is due)
  enabled: true             # backend off switch: false = WF08-10 refreshes and records nothing
  calendar_refresh_hours: 6
  calendar_event_refresh_minutes: 60   # used while a high-importance event is due within event_window_hours
  event_window_hours: 12
  calendar_stale_hours: 36
  news_refresh_minutes: 60
  news_stale_hours: 24
  macro_refresh_hours: 24
  macro_stale_hours: 72
  cot_retry_hours: 3        # COT follows the CFTC release schedule; if the report is late, try again after this
  cot_backfill_years: 4     # history fetched the first time a COT report family is updated
  retry_after_minutes: 30
  notify_dashboard: true    # false = record only
