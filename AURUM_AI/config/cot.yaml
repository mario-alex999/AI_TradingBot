# AURUM AI - Module 02 (COT Institutional Intelligence Engine) configuration.
# Edit this file to change datasets, contract mappings, release timing or classification thresholds -
# no Python changes needed. `python -m aurum.cli cot sync-config` (also run by backfill/update) copies it
# into the cot_datasets / cot_contract_mappings tables.

# --------------------------------------------------------------------------------------------- sources
# auto   = try the CFTC Public Reporting Environment (Socrata API); if it is unreachable/blocked use the
#          official CFTC weekly-updated history files on www.cftc.gov (same CFTC publication).
# socrata | files = force one source.
source: auto

socrata:
  base_url: https://publicreporting.cftc.gov
  page_size: 5000          # Socrata $limit per request
  timeout_seconds: 30
  max_retries: 5
  backoff_seconds: 2.0     # exponential: 2, 4, 8, 16 ... (Retry-After honoured on HTTP 429)
  app_token_env: CFTC_APP_TOKEN   # optional Socrata app token, read from the environment (never stored here)

files:
  base_url: https://www.cftc.gov/files/dea/history
  timeout_seconds: 120
  max_retries: 4
  backoff_seconds: 3.0
  polite_delay_seconds: 1.0   # pause between file downloads

# --------------------------------------------------------------------------------------------- datasets
# history_start = first report date the CFTC publishes for that family (dataset-specific coverage).
# yearly_file / history_file: official CFTC history archives ({year} is substituted).
# dataset_id_status: verified | corroborated | unverified | mismatch.
#   verified     - confirmed by the CFTC portal's own metadata (python -m aurum.cli cot verify-datasets writes this).
#   corroborated - several independent public sources agree, but the portal itself could not be queried.
# All Socrata portals (incl. publicreporting.cftc.gov) return HTTP 403 to this network's IP at the nginx layer
# (2026-11-02); the engine uses the official CFTC history files, which are unaffected.
datasets:
  legacy:
    name: Legacy - Futures Only
    report_scope: futures_only
    dataset_id: 6dca-aqww
    dataset_id_status: corroborated   # independent public sources agree: Legacy futures-only (2026-11-02)
    history_start: "1986-01-15"
    yearly_file: deacot{year}.zip
    history_file: deacot1986_2016.zip
    history_file_last_year: 2016
    description: CFTC Legacy report - commercial, non-commercial and non-reportable positions.
  tff:
    name: Traders in Financial Futures - Futures Only
    report_scope: futures_only
    dataset_id: gpe5-46if
    dataset_id_status: corroborated   # independent public sources agree: TFF futures-only (2026-11-02)
    history_start: "2006-06-13"
    yearly_file: fut_fin_txt_{year}.zip
    history_file: fin_fut_txt_2006_2016.zip
    history_file_last_year: 2016
    description: CFTC TFF report - dealers, asset managers, leveraged funds, other reportables (financial futures only).
  disaggregated:
    name: Disaggregated - Futures Only
    report_scope: futures_only
    dataset_id: 72hh-3qpy
    dataset_id_status: corroborated   # independent public sources agree: Disaggregated futures-only; combined = kh3c-gbw2 (2026-11-02)
    history_start: "2006-06-13"
    yearly_file: fut_disagg_txt_{year}.zip
    history_file: fut_disagg_txt_hist_2006_2016.zip
    history_file_last_year: 2016
    description: CFTC Disaggregated report - producers/merchants, swap dealers, managed money, other reportables (physical commodities).

# --------------------------------------------------------------------------------------------- mappings
