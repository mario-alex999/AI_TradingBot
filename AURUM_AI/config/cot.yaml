    cftc_contract_name: DJIA x $5 - CHICAGO BOARD OF TRADE
    cftc_contract_code: "124603"
    exchange: CBOT (CME Group)
    contract_description: E-mini Dow ($5 x DJIA) futures
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file deacot2025.zip + deacot2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: non_commercial
  - aurum_symbol: US30
    report_type: tff
    cftc_contract_name: DJIA x $5 - CHICAGO BOARD OF TRADE
    cftc_contract_code: "124603"
    exchange: CBOT (CME Group)
    contract_description: E-mini Dow ($5 x DJIA) futures
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file fut_fin_txt_2025.zip + fut_fin_txt_2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: leveraged_funds

# --------------------------------------------------------------------------------------------- release timing
# Positions are "as of" Tuesday (report_date); the CFTC releases them at 15:30 US/Eastern, normally on the
# Friday of the same week. Rule used when no explicit override exists: Friday 15:30 ET; if a US federal
# holiday falls Tue-Fri of that week the release moves to the next business day after that Friday.
# Overrides below come from official CFTC publications and win over the rule.
release:
  timezone: America/New_York
  time: "15:30"
  overrides:
    # Catch-up after the Oct-Nov 2025 lapse in appropriations - CFTC press release 9147-25 (accelerated schedule)
    "2025-09-30": "2025-11-19"
    "2025-10-07": "2025-11-21"
    "2025-10-14": "2025-11-25"
    "2025-10-21": "2025-12-02"
    "2025-10-28": "2025-12-05"
    "2025-11-04": "2025-12-09"
    "2025-11-10": "2025-12-10"
    "2025-11-18": "2025-12-12"
    "2025-11-25": "2025-12-15"
    "2025-12-02": "2025-12-17"
    "2025-12-09": "2025-12-19"
    "2025-12-16": "2025-12-23"
    "2025-12-23": "2025-12-29"
    # Holiday-delayed releases - CFTC 2026 release schedule
    "2025-12-30": "2026-01-05"
    "2026-06-16": "2026-06-22"
    "2026-06-30": "2026-07-06"
    "2026-11-10": "2026-11-16"
    "2026-11-24": "2026-11-30"
    "2026-12-22": "2026-12-28"
  # Report dates whose release date could not be established from an official source are flagged with a
  # data-quality issue; the rule-based date is still used. Known lapses older than the default 4-year window
  # (2013-10, 2018-12/2019-01) are listed so a long backfill warns about them.
  uncertain_ranges:
    - ["2013-10-01", "2013-11-05"]
    - ["2018-12-18", "2019-02-26"]

# --------------------------------------------------------------------------------------------- analytics
analytics:
  percentile_lookbacks_weeks: {12m: 52, 24m: 104, 36m: 156, 48m: 208}
  cot_index_lookback_weeks: 156     # 3 years
  zscore_lookback_weeks: 156
  min_history_weeks: 26             # fewer observations -> percentile / index / z-score are NULL
  significant_change_z: 2.0         # |weekly change| > 2 std of past weekly changes -> significant
  unusual_percentile: [5, 95]       # outside this band -> unusual historical positioning
  # Classification score = mean(36m percentile, COT index). Thresholds are AURUM conventions, not industry standards.
  classification:
    extremely_bullish: 90
    strong_bullish: 75
    moderately_bullish: 60
    moderately_bearish: 40
    strong_bearish: 25
    extremely_bearish: 10
    require_direction_for_extremes: true   # "extremely bullish" also needs net long (and bearish net short)
  divergence:
    price_timeframe: D1
    window_reports: 4                # compare price vs positioning over the last N report intervals
    extreme_lookback_reports: 26     # new-high / new-low confirmation window
    min_price_change_pct: 0.5
  stale_after_days: 10               # latest release older than this (and a newer one expected) -> stale
