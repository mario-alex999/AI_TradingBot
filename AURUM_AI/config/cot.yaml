    verified_at: "2026-11-02"
    primary_category: non_commercial
  - aurum_symbol: EURUSD
    report_type: tff
    cftc_contract_name: EURO FX - CHICAGO MERCANTILE EXCHANGE
    cftc_contract_code: "099741"
    exchange: CME
    contract_description: Euro FX futures (EUR 125,000)
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file fut_fin_txt_2025.zip + fut_fin_txt_2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: leveraged_funds
  - aurum_symbol: GBPUSD
    report_type: legacy
    cftc_contract_name: BRITISH POUND - CHICAGO MERCANTILE EXCHANGE
    cftc_contract_code: "096742"
    exchange: CME
    contract_description: British Pound futures (GBP 62,500)
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file deacot2025.zip + deacot2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: non_commercial
  - aurum_symbol: GBPUSD
    report_type: tff
    cftc_contract_name: BRITISH POUND - CHICAGO MERCANTILE EXCHANGE
    cftc_contract_code: "096742"
    exchange: CME
    contract_description: British Pound futures (GBP 62,500)
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file fut_fin_txt_2025.zip + fut_fin_txt_2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: leveraged_funds
  - aurum_symbol: XAUUSD
    report_type: legacy
    cftc_contract_name: GOLD - COMMODITY EXCHANGE INC.
    cftc_contract_code: "088691"
    exchange: COMEX
    contract_description: Gold futures (100 troy oz)
    currency: USD
    mapping_status: verified
    verification_source: CFTC history file deacot2025.zip + deacot2026.zip (re-checked to 2026-10-27)
    verified_at: "2026-11-02"
    primary_category: non_commercial
  - aurum_symbol: XAUUSD
    report_type: disaggregated
    cftc_contract_name: GOLD - COMMODITY EXCHANGE INC.
    cftc_contract_code: "088691"
    exchange: COMEX
    contract_description: Gold futures (100 troy oz)
    currency: USD
