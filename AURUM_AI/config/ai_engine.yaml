# Module 05 decision engine. Anything left out uses the defaults in aurum/decision/config.py.
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.

entry_timeframes: [H1, M15]

# Direction is read across these timeframes; higher ones weigh more.
bias:
  timeframes: [D1, H4, H1, M15, M5]
  weights: {D1: 5.0, H4: 4.0, H1: 3.0, M15: 2.0, M5: 1.0}
  min_agreement: 0.6

# What a final decision needs. A high score alone is never enough.
decision:
  min_grades: [A, B]
  strong_grade: A

ai_review:
  # Attempts after a failure. Zero, because a timed-out attempt may already have been billed.
  max_retries: 0

gates:
  min_rr: 2.0
  # Pairs that move together count as one exposure in the account-risk and duplication checks.
  correlation_groups:
    - [EURUSD, GBPUSD]
  # Example of a session filter: no Asian-session continuation on GBPUSD.
  session_filters:
    order_block_continuation:
      GBPUSD: [asian]
    fair_value_gap_retracement:
      GBPUSD: [asian]
    premium_discount_ote:
      GBPUSD: [asian]

# Stops: never closer than min_stop_atr x ATR of the entry timeframe (0 = off). A structure stop inside that distance is
# widened, and the target must still give gates.min_rr from the wider stop. OFF: in the 10-20 Nov 2026 backtest (4 markets,
# 117 trades) 1.0 ATR cut the result from +57.9R to +20.6R - wider stops shrink each win more than they raise the win rate.
# Retest on more history before switching it on.
levels:
  min_stop_atr: 0.0

# Which candidates become signals (live and backtest alike).
selection:
  dedupe: true            # one signal per idea: same direction, entry zones overlapping (within overlap_atr x ATR)
  overlap_atr: 0.5
  # A reversal against every higher timeframe (D1 and H4) needs one of these grades.
  counter_trend_templates: [choch_reversal, liquidity_sweep_reversal, range_edge_rejection]
  counter_trend_min_grades: [A, B]

sizing:
  default_risk_pct: 0.5

backtest:
  step_timeframe: H1
  slippage_r: 0.05
  commission_r: 0.0
  # Trades on or after this date are reported as out-of-sample. Leave blank for no split.
  split_date:
