[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-ai"
version = "0.1.0"
description = "AURUM AI - read-only market data (Module 01) and COT institutional intelligence (Module 02) engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
  "pandas>=2.1", "numpy>=1.26", "SQLAlchemy>=2.0.25", "psycopg[binary]>=3.1.18",
  "pydantic>=2.6", "pydantic-settings>=2.7", "python-dotenv>=1.0", "typer>=0.12",
  "rich>=13.7", "PyYAML>=6.0", "pyarrow>=15.0", "tzdata>=2024.1",
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aurum = "aurum.cli:app"

[tool.setuptools.packages.find]
include = ["aurum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: needs a reachable PostgreSQL server (set AURUM_TEST_DATABASE_URL)",
           "live: contacts the real CFTC servers (set AURUM_LIVE_CFTC=1)"]
filterwarnings = ["ignore:.*on_event is deprecated.*:DeprecationWarning"]
